services:
  reporter:
    image: ${OPERATOR_IMAGE:?Set OPERATOR_IMAGE to a published version or digest}
    user: "${OPERATOR_UID:-10001}:${OPERATOR_GID:-10001}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - path: reporter.env
        required: false
    volumes:
      - type: bind
        source: ${OPERATOR_HOME:?Set OPERATOR_HOME to the existing reporter home directory}
        target: /home/akt-reporter
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

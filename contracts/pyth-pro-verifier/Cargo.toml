[package]
name = "pyth-pro-verifier"
version = "0.1.0"
authors = ["Overclock Labs"]
edition = "2021"
description = "Query-only Pyth Pro verifier for Akash Pyth price updates"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []

[dependencies]
cosmwasm-schema = "3.0.2"
cosmwasm-std = "3.0.2"
cw-storage-plus = "3.0.1"
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
sha3 = { version = "0.10", default-features = false }
thiserror = "1.0"
wormhole = { path = "../wormhole", default-features = false, features = ["library"] }

[dev-dependencies]
hex = "0.4"
